<div class="js-enabled" ng-click="block.edit()" ng-focus="block.focus" aria-label="Edit component">
    <aside class="backoffice-block-view tpr-search-results {{block.settingsData.cssClasses}}">
        <ng-content ng-switch="block.settingsData.headingLevel[0]">
            <h3 ng-switch-when="Heading 3" class="{{block.settingsData.headingClass[0]}} tpr-search-results__heading">
                {{ block.data.heading || 'Search Q&As' }}
            </h3>

            <h4 ng-switch-when="Heading 4" class="{{block.settingsData.headingClass[0]}} tpr-search-results__heading">
                {{ block.data.heading || 'Search Q&As' }}
            </h4>

            <h5 ng-switch-when="Heading 5" class="{{block.settingsData.headingClass[0]}} tpr-search-results__heading">
                {{ block.data.heading || 'Search Q&As' }}
            </h5>

            <h6 ng-switch-when="Heading 6" class="{{block.settingsData.headingClass[0]}} tpr-search-results__heading">
                {{ block.data.heading || 'Search Q&As' }}
            </h6>

            <h2 ng-switch-default class="{{block.settingsData.headingClass[0]}} tpr-search-results__heading">
                {{ block.data.heading || 'Search Q&As' }}
            </h2>
        </ng-content>

        <form class="tpr-search-results__form">
            <div class="govuk-form-group">
                <label class="govuk-label govuk-visually-hidden">{{block.data.heading}}</label>
                <div class="tpr-search-results__input-group">
                    <input class="govuk-input" type="text">
                    <div class="govuk-button-group">
                        <button class="govuk-button" type="submit">Ask</button>
                        <button class="govuk-button govuk-button--secondary" type="button">Clear</button>
                    </div>
                </div>
            </div>
        </form>

        <footer class="tpr-search-results__footer">
            <ul class="govuk-list tpr-search-results__links">
                <li>
                    <a href="#" class="govuk-link">Show more questions</a>
                </li>

                <li ng-repeat="link in block.data.footerLinks">
                    <a href="{{link.url}}" class="govuk-link">{{link.nodeName || link.name}}</a>
                </li>
            </ul>
        </footer>
    </aside>
</div>
