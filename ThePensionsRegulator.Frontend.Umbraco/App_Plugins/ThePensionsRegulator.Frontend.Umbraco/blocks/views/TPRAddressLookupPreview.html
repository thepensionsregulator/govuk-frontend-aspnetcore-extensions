<div class="govuk-form-group backoffice-block-view" ng-click="block.edit()" ng-focus="block.focus" aria-label="Edit address lookup component">
    <fieldset class="govuk-fieldset tpr-address-lookup" aria-hidden="true">
        <legend class="govuk-fieldset__legend govuk-fieldset__legend--for-field" ng-bind-html="block.data.legend"></legend>
            <p class="backoffice-additional-blocks" ng-if="!block.data.addressLookupBlocks.contentData">No blocks.</p>
            <p class="backoffice-additional-blocks" ng-if="block.data.addressLookupBlocks.contentData.length===1">1 block.</p>
            <p class="backoffice-additional-blocks" ng-if="block.data.addressLookupBlocks.contentData.length>1">{{block.data.addressLookupBlocks.contentData.length}} blocks.</p>
    </fieldset>
</div>
