
<dl class="tpr-documents {{block.settingsData.cssClasses}}">
    <div class="tpr-document" ng-repeat="doc in block.data.documents.contentData">
        <div ng-if="doc.document[0].url.endsWith('.pdf')">
            <dt>
                <a href="{{doc.document[0].url}}">
                    {{doc.document[0].name}}
                    <br>
                    <span class="pdf fileicon">PDF</span> {{doc.fileSize}}KB, {{doc.numberOfPages}} pages
                </a>
            </dt>
            <dd>Published: {{doc.datePublished}}</dd>
            <dd ng-bind="doc.description"></dd>
        </div>
        <div ng-if="doc.document[0].url.endsWith('.docx')">
            <dt>
                <a href="{{doc.document[0].url}}">
                    {{doc.document[0].name}}
                    <br>
                    <span class="doc fileicon">WORD</span> {{doc.fileSize}}KB, {{doc.numberOfPages}} pages
                </a>
            </dt>
            <dd>Published: {{doc.datePublished}}</dd>
            <dd ng-bind="doc.description"></dd>
        </div>
        <div ng-if="doc.document[0].url.endsWith('.pdf') == false && doc.document[0].url.endsWith('.docx') == false">
            <dt>
                <a href="{{doc.document[0].url}}">{{doc.document[0].name}}</a>
            </dt>
            <dd>Published: {{doc.datePublished}}</dd>
            <dd ng-bind="doc.description"></dd>
        </div>
    </div>
</dl>
